<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>半山面包 · 今日面包</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="shared/brand-extensions.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="variant-bakery-A.css">
</head>
<body>
<header class="site-header" data-zone="header">
  <a class="site-brand" href="#top">半山面包</a>
  <nav class="site-nav" aria-label="页面导航"><a href="#menu">今日面包</a><a href="#visit">到店</a><a href="#order">预订</a></nav>
</header>

<main class="page" id="top">
  <!-- zone:hero:start -->
  <section class="strip" data-zone="hero">
    <h1>每天早上七点出炉</h1>
    <p>天然酵种、本地小麦，杭州西溪路 128 号。卖完即止。</p>
  </section>
  <!-- zone:hero:end -->

  <div class="board-layout">
    <!-- zone:menu:start -->
    <section id="menu" data-zone="menu" aria-labelledby="menu-title">
      <div class="board-head">
        <h2 id="menu-title">今日面包</h2>
        <p class="updated">柜台今早 <span class="num" data-updated></span> 更新</p>
      </div>
      <ul class="board" data-breads></ul>
      <p class="board-note">剩余数量以柜台为准。售罄的面包可以预订明早的那一炉。</p>
    </section>
    <!-- zone:menu:end -->

    <div class="side">
      <!-- zone:order:start -->
      <section id="order" class="order-panel" data-zone="order" aria-labelledby="order-title">
        <h2 id="order-title">预订明早的面包</h2>
        <p class="lead">留个手机号和取货日期，七点出炉后我们为你留到十点。</p>
        <form novalidate>
          <label class="field">
            <span>手机号</span>
            <input name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="11 位手机号" required>
            <span class="field-error" data-error-for="phone" aria-live="polite"></span>
          </label>
          <label class="field">
            <span>取货日期</span>
            <input name="date" type="date" required>
            <span class="field-hint">最早明天（<span data-earliest></span>），周一休息。</span>
            <span class="field-error" data-error-for="date" aria-live="polite"></span>
          </label>
          <p class="form-status" data-status aria-live="polite"></p>
          <button class="btn btn-primary" type="submit">提交预订</button>
        </form>
        <div class="success" data-success hidden role="status">
          <h3>已收到，我们会短信确认。</h3>
          <p data-success-detail></p>
          <p><button class="btn btn-quiet" type="button" data-again>再订一份</button></p>
        </div>
      </section>
      <!-- zone:order:end -->

      <!-- zone:visit:start -->
      <section id="visit" class="visit" data-zone="visit" aria-labelledby="visit-title">
        <h2 id="visit-title">到店</h2>
        <dl>
          <dt>营业</dt><dd>周二至周日 7:00–14:00</dd>
          <dt>休息</dt><dd>周一</dd>
          <dt>地址</dt><dd>杭州西溪路 128 号</dd>
        </dl>
      </section>
      <!-- zone:visit:end -->
    </div>
  </div>
</main>

<footer class="site-footer" data-zone="footer">© 半山面包</footer>

<div class="mobile-bar" data-zone="mobile-bar">
  <span>明早七点出炉</span>
  <a class="btn btn-primary" href="#order">预订明早</a>
</div>

<script src="shared/bakery-data.js"></script>
<script>
(function () {
  var B = window.BANSHAN, d = B.data;
  document.querySelector('[data-updated]').textContent = d.stockUpdatedAt;
  document.querySelector('[data-earliest]').textContent = B.describeEarliest();
  B.renderBreads(document.querySelector('[data-breads]'), function (bread) {
    var state = bread.stock === 0 ? ' is-out' : bread.stock <= 2 ? ' is-low' : '';
    var pieces = '';
    for (var i = 0; i < bread.stock; i++) pieces += '<span class="piece"></span>';
    var tail = bread.stock > 0
      ? '<span class="pieces" aria-hidden="true">' + pieces + '</span>'
      : '<span class="tomorrow">明早可预订</span>';
    return '<li class="' + state.trim() + '">' +
      '<span class="name">' + bread.name + '</span>' +
      '<span class="price num">' + B.formatPrice(bread.price) + '</span>' +
      '<span class="stock">' + B.stockLabel(bread.stock) + '</span>' +
      '<span class="desc">' + bread.desc + '</span>' + tail + '</li>';
  });
  B.setupOrderForm(document.querySelector('#order form'));
})();
</script>
</body>
</html>
