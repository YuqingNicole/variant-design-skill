<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>半山面包 · 每天早上七点出炉</title>
<style>
:root{
  /* 品牌原始色，来自项目 style.css */
  --flour:#f7f1e6;
  --crust:#8a4b22;
  --ink:#2b2118;

  /* 语义层 */
  --color-bg:var(--flour);
  --color-surface:#fffaf2;
  --color-text:var(--ink);
  --color-primary:var(--crust);
  --color-on-primary:#ffffff;
  --color-primary-pressed:color-mix(in oklch, var(--crust) 84%, var(--ink));
  --color-muted:color-mix(in oklch, var(--ink) 66%, var(--flour));
  --color-rule:color-mix(in oklch, var(--ink) 18%, var(--flour));
  --color-row-hover:color-mix(in oklch, var(--crust) 8%, var(--flour));
  --color-error:#9b2f1f;
  --color-disabled:color-mix(in oklch, var(--ink) 45%, var(--flour));
  --color-toast-bg:var(--ink);
  --color-toast-text:var(--flour);

  --font-serif:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
  --font-ui:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;

  /* 动效令牌：B 用物理按压、位移和提示条滑入 */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in:cubic-bezier(.7,0,.84,0);
  --dur-press:120ms;
  --dur-fast:160ms;
  --dur-base:240ms;
  --dur-exit:160ms;

  --space-1:8px;
  --space-2:16px;
  --space-3:24px;
  --space-4:40px;
  --space-5:64px;
  --radius-control:4px;
  --radius-panel:8px;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-serif);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2{font-weight:600}
h2{font-size:1.35rem;margin:0 0 var(--space-2)}
p{margin:0}
:is(a,button,input,summary):focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

.wrap{max-width:1120px;margin:0 auto;padding:0 var(--space-3)}
.top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);padding:var(--space-2) 0}
.brand{font-size:1.1rem}
.top nav{display:flex;gap:var(--space-1)}
.top nav a{color:var(--color-primary);text-decoration:none;padding:10px 10px;border-radius:var(--radius-control);font-family:var(--font-ui);font-size:.95rem;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
@media (hover:hover) and (pointer:fine){.top nav a:hover{background:var(--color-row-hover)}}

.layout{display:grid;gap:var(--space-4);padding-bottom:var(--space-5)}
@media (min-width:1024px){
  .layout{grid-template-columns:minmax(0,1fr) 380px;column-gap:var(--space-5);align-items:start}
  .order-panel{position:sticky;top:88px}
}
.column>section+section{margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--color-rule)}

/* 按钮：实体按压。静止时有 2px 底边，按下时整体下沉并压扁到 98%；“减少动效”下只保留颜色变化 */
.btn{position:relative;overflow:hidden;font:500 1rem/1 var(--font-ui);color:var(--color-on-primary);background:var(--color-primary);border:0;border-radius:var(--radius-control);padding:0 20px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:0 2px 0 var(--color-primary-pressed);transition:background-color var(--dur-press) var(--ease-out),color var(--dur-press) var(--ease-out)}
.btn:active:not(:disabled){background:var(--color-primary-pressed)}
.btn:disabled{background:var(--color-disabled);box-shadow:none;cursor:default}
.btn[aria-busy="true"]{background:var(--color-primary-pressed);cursor:progress}
.btn .progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.6);transform:scaleX(0);transform-origin:left}
.btn[aria-busy="true"] .progress{animation:fill var(--request-ms,500ms) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:no-preference){
  .btn{transition:background-color var(--dur-press) var(--ease-out),color var(--dur-press) var(--ease-out),transform var(--dur-press) var(--ease-out),box-shadow var(--dur-press) var(--ease-out)}
  .btn:active:not(:disabled){transform:translateY(2px) scale(.98);box-shadow:0 0 0 var(--color-primary-pressed)}
}
.link{font:500 .95rem/1 var(--font-ui);color:var(--color-primary);background:none;border:0;padding:12px 4px;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* zone:hero:start */
.hero{padding:var(--space-5) 0 0}
.hero h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1.1;margin:0 0 var(--space-2);max-width:12em}
.hero p{max-width:30em;margin-bottom:var(--space-3)}
@media (min-width:1024px){.hero .btn{display:none}}
/* zone:hero:end */

/* zone:menu:start */
.menu ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--color-rule)}
.menu li{position:relative;display:grid;grid-template-columns:1fr auto auto;align-items:baseline;gap:16px;padding:16px 16px;border-bottom:1px solid var(--color-rule);transition:background-color var(--dur-fast) var(--ease-out)}
/* 悬停：左侧 3px 标记从中间长出，整行底色加深，价格变成品牌色 */
.menu li::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--color-primary);opacity:0;transform:scaleY(0);transition:opacity var(--dur-fast) var(--ease-out)}
@media (prefers-reduced-motion:no-preference){
  .menu li::before{transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
}
@media (prefers-reduced-motion:reduce){
  .menu li::before{transform:none}
}
.menu .price{font-family:var(--font-ui);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right;transition:color var(--dur-fast) var(--ease-out)}
.menu .stock{font-family:var(--font-ui);font-size:.9rem;color:var(--color-muted);min-width:4.5em;text-align:right}
.menu li.is-low .stock{color:var(--color-primary)}
.menu li.is-out{color:var(--color-muted)}
.menu li.is-out .price{text-decoration:line-through}
@media (hover:hover) and (pointer:fine){
  .menu li:not(.is-out):hover{background:var(--color-row-hover)}
  .menu li:not(.is-out):hover::before{opacity:1;transform:scaleY(1)}
  .menu li:not(.is-out):hover .price{color:var(--color-primary)}
}
.menu .note{margin-top:var(--space-2);font-family:var(--font-ui);font-size:.9rem;color:var(--color-muted)}
@media (max-width:639px){
  .menu li{grid-template-columns:1fr auto;padding-left:12px;padding-right:12px}
  .menu .stock{grid-column:1 / -1;text-align:left;min-width:0}
}
/* zone:menu:end */

/* zone:visit:start */
.visit p{max-width:30em}
/* zone:visit:end */

/* zone:order:start */
.order-panel{background:var(--color-surface);border:1px solid var(--color-rule);border-radius:var(--radius-panel);padding:var(--space-3)}
.order-panel h2{margin-bottom:4px}
.order-panel .sub{font-family:var(--font-ui);font-size:.95rem;color:var(--color-muted);margin-bottom:var(--space-3)}
.order-panel .low{font-family:var(--font-ui);font-size:.95rem;color:var(--color-primary);margin-bottom:var(--space-2)}
form{display:grid;gap:var(--space-2)}
.field{display:grid;gap:6px}
.field label{font-family:var(--font-ui);font-size:.95rem}
.field input{font:1rem var(--font-ui);padding:0 12px;min-height:44px;border:1px solid var(--color-muted);border-radius:var(--radius-control);background:#fff;color:var(--color-text);transition:border-color var(--dur-fast) var(--ease-out)}
.field input[aria-invalid="true"]{border-color:var(--color-error)}
@media (prefers-reduced-motion:no-preference){
  .field.is-error input{animation:shake 240ms var(--ease-out)}
}
@keyframes shake{20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.err{font-family:var(--font-ui);font-size:.9rem;color:var(--color-error)}
.actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.inline-ok{font-family:var(--font-ui);font-size:.95rem;min-height:1.6em}
/* zone:order:end */

/* 成功提示条：从底部上浮 16px 并淡入；退出更快；“减少动效”下只淡入淡出 */
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;gap:12px;max-width:min(92vw,560px);padding:8px 8px 8px 16px;border-radius:var(--radius-panel);background:var(--color-toast-bg);color:var(--color-toast-text);font-family:var(--font-ui);font-size:.95rem;box-shadow:0 8px 24px rgba(43,33,24,.18);visibility:hidden;opacity:0;transform:translate(-50%,0);transition:opacity var(--dur-base) var(--ease-out)}
@media (prefers-reduced-motion:no-preference){
  .toast{transform:translate(-50%,16px);transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out)}
}
.toast.is-open{visibility:visible;opacity:1;transform:translate(-50%,0)}
.toast.is-closing{visibility:visible;opacity:0;transition-duration:var(--dur-exit);transition-timing-function:var(--ease-in)}
.toast-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--color-toast-text);color:var(--color-toast-bg);font-size:.85rem;flex:none}
.toast p{flex:1 1 auto}
.toast-close{font:500 .9rem/1 var(--font-ui);color:var(--color-toast-text);background:none;border:1px solid rgba(247,241,230,.4);border-radius:var(--radius-control);min-height:40px;min-width:44px;padding:0 10px;cursor:pointer}
.toast-close:focus-visible{outline-color:var(--color-toast-text)}

footer{padding:var(--space-3) 0;font-family:var(--font-ui);font-size:.9rem;color:var(--color-muted)}

@media (prefers-reduced-motion:reduce){
  .page *{transition-property:opacity,color,background-color,border-color,visibility !important}
  .field.is-error input{animation:none}
}
</style>
</head>
<body class="page">
<div class="wrap">
  <header class="top">
    <strong class="brand">半山面包</strong>
    <nav aria-label="页面导航"><a href="#menu">今日面包</a><a href="#visit">到店</a><a href="#order">预订</a></nav>
  </header>

  <div class="layout">
    <div class="column">
      <!-- zone:hero:start -->
      <section class="hero" data-zone="hero">
        <h1>每天早上七点出炉</h1>
        <p>天然酵种、本地小麦，杭州西溪路 128 号。卖完即止。</p>
        <a class="btn" href="#order">预订明早的面包</a>
      </section>
      <!-- zone:hero:end -->

      <!-- zone:menu:start -->
      <section id="menu" class="menu" data-zone="menu">
        <h2>今日面包</h2>
        <ul id="bread-list" aria-label="今日面包与余量"></ul>
        <p class="note">余量是当前柜台数字，卖完即止。</p>
      </section>
      <!-- zone:menu:end -->

      <!-- zone:visit:start -->
      <section id="visit" class="visit" data-zone="visit">
        <h2>到店</h2>
        <p>周二至周日 7:00–14:00 · 周一休息</p>
        <p>杭州西溪路 128 号</p>
      </section>
      <!-- zone:visit:end -->
    </div>

    <!-- zone:order:start -->
    <section id="order" class="order-panel" data-zone="order">
      <h2>预订</h2>
      <p class="sub">明早 7:00 出炉，留下手机号和取货日期。</p>
      <p class="low" id="low-stock"></p>
      <form id="order-form" novalidate>
        <div class="field" id="phone-field">
          <label for="phone">手机号</label>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" required aria-describedby="phone-err">
          <small class="err" id="phone-err" hidden></small>
        </div>
        <div class="field" id="date-field">
          <label for="date">取货日期</label>
          <input id="date" name="date" type="date" required aria-describedby="date-err">
          <small class="err" id="date-err" hidden></small>
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="submit"><span id="submit-label">提交预订</span><span class="progress" aria-hidden="true"></span></button>
          <button class="link" type="button" id="again" hidden>再订一份</button>
        </div>
        <p class="inline-ok" id="ok"></p>
      </form>
    </section>
    <!-- zone:order:end -->
  </div>

  <footer>© 半山面包</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-icon" aria-hidden="true">✓</span>
  <p id="toast-text"></p>
  <button type="button" class="toast-close" id="toast-close">关闭</button>
</div>

<script src="shared/bakery-data.js"></script>
<script>
(function () {
  const data = window.BAKERY;
  const list = document.getElementById("bread-list");
  const lowStock = document.getElementById("low-stock");
  const form = document.getElementById("order-form");
  const phone = document.getElementById("phone");
  const date = document.getElementById("date");
  const phoneField = document.getElementById("phone-field");
  const dateField = document.getElementById("date-field");
  const phoneErr = document.getElementById("phone-err");
  const dateErr = document.getElementById("date-err");
  const submit = document.getElementById("submit");
  const submitLabel = document.getElementById("submit-label");
  const again = document.getElementById("again");
  const ok = document.getElementById("ok");
  const toast = document.getElementById("toast");
  const toastText = document.getElementById("toast-text");
  const toastClose = document.getElementById("toast-close");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let busy = false;
  let pending = 0;
  let toastTimer = 0;
  let toastExit = 0;

  document.documentElement.style.setProperty("--request-ms", data.requestDelayMs + "ms");

  data.breads.forEach(function (bread) {
    const li = document.createElement("li");
    li.className = bread.stock === 0 ? "is-out" : (bread.stock <= 2 ? "is-low" : "");
    const name = document.createElement("b");
    name.textContent = bread.name;
    const price = document.createElement("span");
    price.className = "price";
    price.textContent = data.yuan.format(bread.price);
    const stock = document.createElement("small");
    stock.className = "stock";
    stock.textContent = data.stockLabel(bread.stock);
    li.append(name, price, stock);
    list.appendChild(li);
  });

  const low = data.breads.filter(function (b) { return b.stock > 0 && b.stock <= 2; });
  if (low.length) {
    lowStock.textContent = low.map(function (b) { return b.name + "只剩 " + b.stock + " 个"; }).join("，") + "。";
  } else {
    lowStock.hidden = true;
  }

  const min = data.isoDate(data.tomorrow());
  date.min = min;
  date.value = min;

  function setError(field, input, el, message) {
    if (message) {
      el.textContent = message;
      el.hidden = false;
      input.setAttribute("aria-invalid", "true");
      field.classList.remove("is-error");
      void field.offsetWidth;
      field.classList.add("is-error");
    } else {
      el.textContent = "";
      el.hidden = true;
      input.removeAttribute("aria-invalid");
      field.classList.remove("is-error");
    }
  }

  phone.addEventListener("input", function () { setError(phoneField, phone, phoneErr, ""); });
  date.addEventListener("input", function () { setError(dateField, date, dateErr, ""); });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (busy) return;
    const phoneOk = data.validPhone(phone.value);
    const dateOk = Boolean(date.value) && date.value >= min;
    setError(phoneField, phone, phoneErr, phoneOk ? "" : data.messages.phoneError);
    setError(dateField, date, dateErr, dateOk ? "" : data.messages.dateError);
    if (!phoneOk) { phone.focus(); return; }
    if (!dateOk) { date.focus(); return; }

    busy = true;
    submit.setAttribute("aria-busy", "true");
    submitLabel.textContent = data.messages.submitting;
    pending = window.setTimeout(finish, data.requestDelayMs);
  });

  function finish() {
    busy = false;
    submit.removeAttribute("aria-busy");
    submitLabel.textContent = data.messages.submitted;
    submit.disabled = true;
    again.hidden = false;
    ok.textContent = data.formatDay(date.value) + "取货 · 短信确认到 " + data.maskPhone(phone.value);
    openToast("已收到，我们会短信确认到 " + data.maskPhone(phone.value) + "。");
  }

  function openToast(message) {
    window.clearTimeout(toastTimer);
    window.clearTimeout(toastExit);
    toast.classList.remove("is-closing");
    toastText.textContent = message;
    requestAnimationFrame(function () { toast.classList.add("is-open"); });
    armDismiss();
  }

  function armDismiss() {
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(closeToast, 6000);
  }

  function closeToast() {
    window.clearTimeout(toastTimer);
    if (!toast.classList.contains("is-open")) return;
    toast.classList.remove("is-open");
    toast.classList.add("is-closing");
    const settle = function () {
      toast.classList.remove("is-closing");
      toast.removeEventListener("transitionend", settle);
      window.clearTimeout(toastExit);
    };
    toast.addEventListener("transitionend", settle);
    toastExit = window.setTimeout(settle, 400);
  }

  toastClose.addEventListener("click", closeToast);
  toast.addEventListener("mouseenter", function () { window.clearTimeout(toastTimer); });
  toast.addEventListener("mouseleave", armDismiss);
  toast.addEventListener("focusin", function () { window.clearTimeout(toastTimer); });
  toast.addEventListener("focusout", armDismiss);
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") closeToast();
  });

  /* 浏览时切换到“减少动效”：立即结束正在进行的位移，保留状态 */
  reduceMotion.addEventListener("change", function () {
    if (reduceMotion.matches) {
      phoneField.classList.remove("is-error");
      dateField.classList.remove("is-error");
    }
  });

  again.addEventListener("click", function () {
    window.clearTimeout(pending);
    busy = false;
    closeToast();
    ok.textContent = "";
    submit.disabled = false;
    submit.removeAttribute("aria-busy");
    submitLabel.textContent = "提交预订";
    again.hidden = true;
    phone.value = "";
    phone.focus();
  });
})();
</script>
</body>
</html>
