<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1426" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="一个提示词，生成三种有明确立场的视觉方向。比较、批判、变化，再交付真正值得保留的方案。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/variant-favicon-v2.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Variant Design — 第一稿不是答案。</title>
    <script>
      // Page-to-page navigation crossfades (@view-transition in src/site-system.css). It must listen here: pagereveal fires before
      // the deferred module runs. Cards carry `ref-<id>` names for the same-page card-to-detail morph; while a cross-document
      // transition runs, `vt-cross` drops them so one reference on two pages does not fly across the screen.
      (function () {
        var cl = document.documentElement.classList;
        addEventListener("pageswap", function (e) { if (e.viewTransition) cl.add("vt-cross"); });
        addEventListener("pagereveal", function (e) { if (e.viewTransition) { cl.add("vt-cross"); e.viewTransition.finished.then(function () { cl.remove("vt-cross"); }, function () { cl.remove("vt-cross"); }); } });
        addEventListener("pageshow", function (e) { if (e.persisted) cl.remove("vt-cross"); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
