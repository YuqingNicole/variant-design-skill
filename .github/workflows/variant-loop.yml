name: Variant loop regressions
on:
  push:
  pull_request:
jobs:
  loop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: python3 scripts/plugin-package.test.py
      - run: node --test scripts/variant-loop.test.mjs scripts/variant-integrate.test.mjs scripts/artifact-verification.test.mjs scripts/project-profile.test.mjs scripts/design-task.test.mjs
      - run: node scripts/quality-gate.mjs --self-test
      - run: node scripts/quality-gate.mjs examples/coffee-brand-interactive.html --strict
      - run: npm ci
        working-directory: tests
      # Installing Chromium's apt dependencies (--with-deps) has hung for 10+ minutes on hosted
      # runners. The image's preinstalled Chrome already brings the system libraries, so download
      # only Playwright's own Chromium, which matches the pinned Playwright version.
      - name: Install Playwright Chromium
        working-directory: tests
        timeout-minutes: 12
        run: for attempt in 1 2; do timeout 300 npx playwright install chromium && exit 0; done; exit 1
      - run: npm test
        working-directory: tests
      - run: npm run typecheck
        working-directory: tests
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  landing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npm ci
        working-directory: tests
      # Installing Chromium's apt dependencies (--with-deps) has hung for 10+ minutes on hosted
      # runners. The image's preinstalled Chrome already brings the system libraries, so download
      # only Playwright's own Chromium, which matches the pinned Playwright version.
      - name: Install Playwright Chromium
        working-directory: tests
        timeout-minutes: 12
        run: for attempt in 1 2; do timeout 300 npx playwright install chromium && exit 0; done; exit 1
      - run: npm run test:landing
        working-directory: tests
      - run: npx playwright test -c canvas.config.mjs
        working-directory: tests
